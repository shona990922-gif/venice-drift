<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#162c30" />
    <meta
      name="description"
      content="A slow, reflective gondola journey through Venice."
    />
    <title>Venice Drift — A slow journey through Venice</title>
    <link rel="icon" href="./favicon.svg" />
  </head>
  <body>
    <canvas
      id="scene"
      tabindex="0"
      aria-label="Venice gondola journey. Drag to look around."
    ></canvas>
    <div id="entry">
      <div class="entry-content">
        <p class="eyebrow">A SLOW JOURNEY THROUGH VENICE</p>
        <h1>Venice<br /><i>Drift</i></h1>
        <p class="intro">A seat on the water.<br />Nowhere else to be.</p>
        <button id="start" disabled>Start Journey <span>↗</span></button>
        <p class="entry-hint">Sit back. Drag to look around.</p>
      </div>
      <span class="edition">VENEZIA · LATE AFTERNOON</span>
    </div>
    <div id="loading" role="status">Preparing your gondola…</div>
    <div id="hint">Drag to look around</div>
    <div id="fade"></div>
    <nav id="controls" aria-label="Journey settings">
      <label class="setting"
        ><span>Weather</span
        ><select id="weather" aria-label="Weather" title="W · Change weather">
          <option value="journey">Auto light</option>
          <option value="day">Sunny</option>
          <option value="sunset">Sunset</option>
          <option value="rain">Light rain</option>
        </select></label
      >
      <label class="setting"
        ><span>Boat speed</span
        ><select
          id="speed"
          aria-label="Boat speed"
          title="V · Change pace / Space · Stop or resume"
        >
          <option value="0">Stopped</option>
          <option value="0.65">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.25">Brisk</option>
        </select></label
      >
      <button id="sound" aria-label="Sound off">Sound off</button
      ><label
        ><span class="sr-only">Quality</span
        ><select id="quality" aria-label="Quality">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select></label
      ><button id="fullscreen" aria-label="Fullscreen">Fullscreen</button>
    </nav>
    <aside id="debug" hidden>
      <div id="stats"></div>
      <label
        >位置
        <input
          id="inspect-distance"
          type="number"
          min="0"
          max="499"
          value="0"
          aria-label="检查位置"
          style="width: 65px" /></label
      ><button id="inspect-go">定位</button><button id="jump-start">起点</button
      ><button id="jump-bridge">第一座桥</button
      ><button id="jump-golden">金色时刻</button
      ><button id="jump-end">末段</button
      ><button id="sky-check">天空流畅度检查</button
      ><button id="look-check">环视白屏检查</button
      ><button id="interaction-check">验证尾流</button
      ><label
        >水线视角
        <select id="wake-view" aria-label="水线视角">
          <option value="bow">船头</option>
          <option value="side">船侧</option>
          <option value="stern">回看尾流</option>
        </select></label
      ><label
        ><input id="wake-visible" type="checkbox" checked />波纹参与渲染</label
      ><button id="jump-hero">夕阳构图</button><button id="pause">暂停</button
      ><button id="measure">测量</button><button id="capture">截图</button
      ><button id="touch-check">触摸事件验收</button
      ><button id="record">录制 12 秒</button
      ><button id="audit">完整两趟验收</button>
      <p id="audit-status"></p>
      <pre id="measurement"></pre>
    </aside>
    <p id="notice" role="status"></p>
    <pre id="error" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
