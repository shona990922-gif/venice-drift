<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#162c30"><meta name="description" content="A slow, reflective gondola journey through Venice."><title>Venice Drift — A slow journey through Venice</title><link rel="icon" href="./favicon.svg"></head><body>
<canvas id="scene" tabindex="0" aria-label="Venice gondola journey. Drag to look around."></canvas>
<div id="entry"><div class="entry-content"><p class="eyebrow">A SLOW JOURNEY THROUGH VENICE</p><h1>Venice<br><i>Drift</i></h1><p class="intro">A seat on the water.<br>Nowhere else to be.</p><button id="start" disabled>Start Journey <span>↗</span></button><p class="entry-hint">Sit back. Drag to look around.</p></div><span class="edition">VENEZIA · LATE AFTERNOON</span></div>
